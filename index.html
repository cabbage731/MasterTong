<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点点吧</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* background: radial-gradient(200% 100% at bottom center, #b8e1fc 0%, #c2e0f5 20%, #e0c3e8 55%, #f5cdbb 85%, #ffe6b0);
            background: radial-gradient(220% 105% at top center, #1b2947 10%, #75517d 40%, #e96f92 65%, #f7f7b6); */
            background: radial-gradient(220% 105% at top center, #92b3c9 10%, #d998e8 40%, #e96f92 65%, #f7f7b6);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
        }

        @keyframes rotate {
            0% {
                transform: perspective(400px) rotateZ(20deg) rotateX(-40deg) rotateY(0);
            }

            100% {
                transform: perspective(400px) rotateZ(20deg) rotateX(-40deg) rotateY(-360deg);
            }
        }

        #stars {
            transform: perspective(500px);
            transform-style: preserve-3d;
            position: fixed;
            perspective-origin: 50% 100%;
            left: 50%;
            animation: rotate 66s infinite linear;
            bottom: 0;
            z-index: -99;
        }

        .star {
            width: 2px;
            height: 2px;
            background: #f7f7b8;
            position: fixed;
            top: 0px;
            left: 0;
            backface-visibility: hidden;
        }
        
        .message-center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 800px;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .message {
            position: absolute;
            padding: 10px 0;
            pointer-events: none;
            opacity: 0;
            text-align: center;
            width: 100%;
            transition: opacity 0.3s ease, transform 0.5s ease;
        }
        
        .message-content {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            display: inline-block;
            max-width: 90%;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        .message-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.9;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes messageAppear {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes messageDisappear {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
        }
        
        .message.appear {
            animation: messageAppear 0.5s ease-out forwards;
        }
        
        .message.disappear {
            animation: messageDisappear 0.5s ease-out forwards;
        }
        
        @media (max-width: 768px) {
            .message-content {
                font-size: 2.2rem;
            }
            
            .message-icon {
                font-size: 3rem;
            }
        }
        
        @media (max-width: 480px) {
            .message-content {
                font-size: 1.8rem;
            }
            
            .message-icon {
                font-size: 2.5rem;
            }
        }
    </style>

                let childStart = document.createElement("div");
                childStart.setAttribute("class", 'star');
                parentStarts.appendChild(childStart);
            }
            for (let i = 0; i < starsCount; i++) {
                let item = parentStarts.children[i];
                let speed = 0.2 + (Math.random() * 1);
                let thisDistance = distance + (Math.random() * 300);
                item.style.transformOrigin = "0 0 " + thisDistance + "px";
                item.style.transform = "translate3d(0,0,-" + thisDistance + "px) rotateY(" + (Math.random() * 360) + "deg) rotateX(" + (Math.random() * -50) + "deg) scale(" + speed + "," + speed + ")";
            }
        })();

    <script type="text/javascript" src="js/jquery-2.0.0.min.js"></script>

<script type="text/javascript">
$(function(){
var Fireworks = function(){
var self = this;
var rand = function(rMi, rMa){return ~~((Math.random()*(rMa-rMi+1))+rMi);}
var hitTest = function(x1, y1, w1, h1, x2, y2, w2, h2){return !(x1 + w1 < x2 || x2 + w2 < x1 || y1 + h1 < y2 || y2 + h2 < y1);};
window.requestAnimFrame=function(){return window.requestAnimationFrame||window.webkitRequestAnimationFrame||window.mozRequestAnimationFrame||window.oRequestAnimationFrame||window.msRequestAnimationFrame||function(a){window.setTimeout(a,1E3/60)}}();

self.init = function(){ 
self.canvas = document.createElement('canvas');             
self.canvas.width = self.cw = $(window).innerWidth();
self.canvas.height = self.ch = $(window).innerHeight();         
self.particles = [];    
self.partCount = 150;
self.fireworks = [];    
self.mx = self.cw/2;
self.my = self.ch/2;
self.currentHue = 30;
self.partSpeed = 5;
self.partSpeedVariance = 10;
self.partWind = 50;
self.partFriction = 5;
self.partGravity = 1;
self.hueMin = 0;
self.hueMax = 360;
self.fworkSpeed = 4;
self.fworkAccel = 10;
self.hueVariance = 30;
self.flickerDensity = 25;
self.showShockwave = true;
self.showTarget = false;
self.clearAlpha = 25;

$(document.body).append(self.canvas);
self.ctx = self.canvas.getContext('2d');
self.ctx.lineCap = 'round';
self.ctx.lineJoin = 'round';
self.lineWidth = 1;
self.bindEvents();          
self.canvasLoop();

self.canvas.onselectstart = function() {
return false;
};
};      

self.createParticles = function(x,y, hue){
var countdown = self.partCount;
while(countdown--){
var newParticle = {
    x: x,
    y: y,
    coordLast: [
        {x: x, y: y},
        {x: x, y: y},
        {x: x, y: y}
    ],
    angle: rand(0, 360),
    speed: rand(((self.partSpeed - self.partSpeedVariance) <= 0) ? 1 : self.partSpeed - self.partSpeedVariance, (self.partSpeed + self.partSpeedVariance)),
    friction: 1 - self.partFriction/100,
    gravity: self.partGravity/2,
    hue: rand(hue-self.hueVariance, hue+self.hueVariance),
    brightness: rand(50, 80),
    alpha: rand(40,100)/100,
    decay: rand(10, 50)/1000,
    wind: (rand(0, self.partWind) - (self.partWind/2))/25,
    lineWidth: self.lineWidth
};              
self.particles.push(newParticle);
}
};


self.updateParticles = function(){
var i = self.particles.length;
while(i--){
var p = self.particles[i];
var radians = p.angle * Math.PI / 180;
var vx = Math.cos(radians) * p.speed;
var vy = Math.sin(radians) * p.speed;
p.speed *= p.friction;
                
p.coordLast[2].x = p.coordLast[1].x;
p.coordLast[2].y = p.coordLast[1].y;
p.coordLast[1].x = p.coordLast[0].x;
p.coordLast[1].y = p.coordLast[0].y;
p.coordLast[0].x = p.x;
p.coordLast[0].y = p.y;

p.x += vx;
p.y += vy;
p.y += p.gravity;

p.angle += p.wind;              
p.alpha -= p.decay;

if(!hitTest(0,0,self.cw,self.ch,p.x-p.radius, p.y-p.radius, p.radius*2, p.radius*2) || p.alpha < .05){                  
    self.particles.splice(i, 1);    
}
};
};

self.drawParticles = function(){
var i = self.particles.length;
while(i--){
var p = self.particles[i];                          

var coordRand = (rand(1,3)-1);
self.ctx.beginPath();                               
self.ctx.moveTo(Math.round(p.coordLast[coordRand].x), Math.round(p.coordLast[coordRand].y));
self.ctx.lineTo(Math.round(p.x), Math.round(p.y));
self.ctx.closePath();               
self.ctx.strokeStyle = 'hsla('+p.hue+', 100%, '+p.brightness+'%, '+p.alpha+')';
self.ctx.stroke();              

if(self.flickerDensity > 0){
    var inverseDensity = 50 - self.flickerDensity;                  
    if(rand(0, inverseDensity) === inverseDensity){
        self.ctx.beginPath();
        self.ctx.arc(Math.round(p.x), Math.round(p.y), rand(p.lineWidth,p.lineWidth+3)/2, 0, Math.PI*2, false)
        self.ctx.closePath();
        var randAlpha = rand(50,100)/100;
        self.ctx.fillStyle = 'hsla('+p.hue+', 100%, '+p.brightness+'%, '+randAlpha+')';
        self.ctx.fill();
    }   
}
};
};


self.createFireworks = function(startX, startY, targetX, targetY){
var newFirework = {
x: startX,
y: startY,
startX: startX,
startY: startY,
hitX: false,
hitY: false,
coordLast: [
    {x: startX, y: startY},
    {x: startX, y: startY},
    {x: startX, y: startY}
],
targetX: targetX,
targetY: targetY,
speed: self.fworkSpeed,
angle: Math.atan2(targetY - startY, targetX - startX),
shockwaveAngle: Math.atan2(targetY - startY, targetX - startX)+(90*(Math.PI/180)),
acceleration: self.fworkAccel/100,
hue: self.currentHue,
brightness: rand(50, 80),
alpha: rand(50,100)/100,
lineWidth: self.lineWidth
};          
self.fireworks.push(newFirework);

};


self.updateFireworks = function(){
var i = self.fireworks.length;

while(i--){
var f = self.fireworks[i];
self.ctx.lineWidth = f.lineWidth;

vx = Math.cos(f.angle) * f.speed,
vy = Math.sin(f.angle) * f.speed;
f.speed *= 1 + f.acceleration;              
f.coordLast[2].x = f.coordLast[1].x;
f.coordLast[2].y = f.coordLast[1].y;
f.coordLast[1].x = f.coordLast[0].x;
f.coordLast[1].y = f.coordLast[0].y;
f.coordLast[0].x = f.x;
f.coordLast[0].y = f.y;

if(f.startX >= f.targetX){
    if(f.x + vx <= f.targetX){
        f.x = f.targetX;
        f.hitX = true;
    } else {
        f.x += vx;
    }
} else {
    if(f.x + vx >= f.targetX){
        f.x = f.targetX;
        f.hitX = true;
    } else {
        f.x += vx;
    }
}

if(f.startY >= f.targetY){
    if(f.y + vy <= f.targetY){
        f.y = f.targetY;
        f.hitY = true;
    } else {
        f.y += vy;
    }
} else {
    if(f.y + vy >= f.targetY){
        f.y = f.targetY;
        f.hitY = true;
    } else {
        f.y += vy;
    }
}               

if(f.hitX && f.hitY){
    self.createParticles(f.targetX, f.targetY, f.hue);
    self.fireworks.splice(i, 1);
    
}
};
};

self.drawFireworks = function(){
var i = self.fireworks.length;
self.ctx.globalCompositeOperation = 'lighter';
while(i--){
var f = self.fireworks[i];      
self.ctx.lineWidth = f.lineWidth;

var coordRand = (rand(1,3)-1);                  
self.ctx.beginPath();                           
self.ctx.moveTo(Math.round(f.coordLast[coordRand].x), Math.round(f.coordLast[coordRand].y));
self.ctx.lineTo(Math.round(f.x), Math.round(f.y));
self.ctx.closePath();
self.ctx.strokeStyle = 'hsla('+f.hue+', 100%, '+f.brightness+'%, '+f.alpha+')';
self.ctx.stroke();  

if(self.showTarget){
    self.ctx.save();
    self.ctx.beginPath();
    self.ctx.arc(Math.round(f.targetX), Math.round(f.targetY), rand(1,8), 0, Math.PI*2, false)
    self.ctx.closePath();
    self.ctx.lineWidth = 1;
    self.ctx.stroke();
    self.ctx.restore();
}
    
if(self.showShockwave){
    self.ctx.save();
    self.ctx.translate(Math.round(f.x), Math.round(f.y));
    self.ctx.rotate(f.shockwaveAngle);
    self.ctx.beginPath();
    self.ctx.arc(0, 0, 1*(f.speed/5), 0, Math.PI, true);
    self.ctx.strokeStyle = 'hsla('+f.hue+', 100%, '+f.brightness+'%, '+rand(25, 60)/100+')';
    self.ctx.lineWidth = f.lineWidth;
    self.ctx.stroke();
    self.ctx.restore();
}
};
};

self.bindEvents = function(){
$(window).on('resize', function(){          
clearTimeout(self.timeout);
self.timeout = setTimeout(function() {
    self.canvas.width = self.cw = $(window).innerWidth();
    self.canvas.height = self.ch = $(window).innerHeight();
    self.ctx.lineCap = 'round';
    self.ctx.lineJoin = 'round';
}, 100);
});

$(self.canvas).on('mousedown', function(e){
self.mx = e.pageX - self.canvas.offsetLeft;
self.my = e.pageY - self.canvas.offsetTop;
self.currentHue = rand(self.hueMin, self.hueMax);
self.createFireworks(self.cw/2, self.ch, self.mx, self.my); 

$(self.canvas).on('mousemove.fireworks', function(e){
    self.mx = e.pageX - self.canvas.offsetLeft;
    self.my = e.pageY - self.canvas.offsetTop;
    self.currentHue = rand(self.hueMin, self.hueMax);
    self.createFireworks(self.cw/2, self.ch, self.mx, self.my);                                 
});             
});

$(self.canvas).on('mouseup', function(e){
$(self.canvas).off('mousemove.fireworks');                                  
});
        
}

self.clear = function(){
self.particles = [];
self.fireworks = [];
self.ctx.clearRect(0, 0, self.cw, self.ch);
};


self.canvasLoop = function(){
requestAnimFrame(self.canvasLoop, self.canvas);         
self.ctx.globalCompositeOperation = 'destination-out';
self.ctx.fillStyle = 'rgba(0,0,0,'+self.clearAlpha/100+')';
self.ctx.fillRect(0,0,self.cw,self.ch);
self.updateFireworks();
self.updateParticles();
self.drawFireworks();           
self.drawParticles();

};

self.init();        

}
var fworks = new Fireworks();

});

</script>

        function calculateDisplayTime(text) {
            const chineseChars = text.replace(/[^\u4e00-\u9fa5]/g, '');
            const charCount = chineseChars.length;

            // 频率，最低2秒
            const baseTimePerChar = 1000 / 5;
            const minDisplayTime = 2000;
            const maxDisplayTime = 5000;
            
            let displayTime = charCount * baseTimePerChar;
            
            displayTime = Math.max(minDisplayTime, Math.min(displayTime, maxDisplayTime));
            
            // console.log(`文字："${text}"，字数：${charCount}，显示时间：${displayTime}ms`);
            return displayTime;
        }

                return;
            }
            
            canClick = false;
            
            
            const index = Math.floor(clickCount % messages.length);
            clickCount++;
            const messageData = messages[index];
            const displayTime = calculateDisplayTime(messageData.text);
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            setTimeout(() => {
                canClick = true;
            }, displayTime);
            if (messageData.specialFirework) {
                startVerticalFireworks();
            }
            messageElement.innerHTML = `
                <div class="message-icon" style="color: ${messageData.color}">
                    <i class="${messageData.icon}"></i>
                </div>
                <div class="message-content" style="color: ${messageData.color}">${messageData.text}</div>
            `;
            
            messageCenter.appendChild(messageElement);
            
            // 出现动画
            setTimeout(() => {
                messageElement.classList.add('appear');
            }, 10);
            
            setTimeout(() => {
                messageElement.classList.remove('appear');
                messageElement.classList.add('disappear');
                
                setTimeout(() => {
                    if (messageElement.parentNode) {
                        messageElement.parentNode.removeChild(messageElement);
                    }
                }, 500);
            }, displayTime);
        }
        
        const messageCenter = document.getElementById('message-center');
        const bodyElement = document.body;
        
        let canClick = true;
        let clickCount = 0;
        const COOLDOWN_TIME = 2000;
        
        bodyElement.addEventListener('click', function(event) {
            play(event);
        });

        window.addEventListener('load', function() {
            play(event);
        });
        const audio = new Audio();
        audio.src = "sleeeep.m4a";
        audio.loop = true;
        audio.volume = 0.55;
        audio.preload = "auto";
        
        let musicAllowed = false;
        const musicControlDiv = document.getElementById('musicControl');
        const musicStatusSpan = document.getElementById('musicStatus');
        const musicIconElem = document.getElementById('musicIcon');
        
        // 尝试自动播放（静音模式）
        audio.muted = true;
        audio.play().then(() => {
            // 静音自动播放成功，代表可播放但被静音
            musicAllowed = true;
            musicStatusSpan.innerText = " ";
            musicIconElem.className = "fas fa-volume-mute music-icon";
            // 由于浏览器策略：用户首次点击页面任何地方，取消静音并恢复音量
            const unlockMusic = function() {
                if (audio.muted) {
                    audio.muted = false;
                    audio.volume = 0.55;
                    musicStatusSpan.innerText = "";
                    musicIconElem.className = "fas fa-music music-icon";
                    musicAllowed = true;
                }
                document.body.removeEventListener('click', unlockMusic);
                document.body.removeEventListener('touchstart', unlockMusic);
            };
            document.body.addEventListener('click', unlockMusic);
            document.body.addEventListener('touchstart', unlockMusic);
        }).catch((err) => {
            // 自动播放被完全阻止，静候用户首次点击
            musicStatusSpan.innerText = " ";
            musicIconElem.className = "fas fa-play-circle music-icon";
            const firstInteraction = function() {
                if (!musicAllowed) {
                    audio.muted = false;
                    audio.play().then(() => {
                        musicAllowed = true;
                        musicStatusSpan.innerText = "";
                        musicIconElem.className = "fas fa-music music-icon";
                    }).catch(e => {
                        musicStatusSpan.innerText = " ";
                    });
                }
                document.body.removeEventListener('click', firstInteraction);
                document.body.removeEventListener('touchstart', firstInteraction);
            };
            document.body.addEventListener('click', firstInteraction);
            document.body.addEventListener('touchstart', firstInteraction);
        });
    </script>
</body>
